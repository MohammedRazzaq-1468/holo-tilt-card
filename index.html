<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090b13">
    <title>Aurora Shard — Holo Tilt Card</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="hct-page">
        <p class="hct-kicker">Prism Series · 014</p>
        <div class="hct-scene">
            <button class="hct-card" type="button" aria-label="Aurora Shard, holographic collectible card. Press to flash the foil.">
                <span class="hct-backlight" aria-hidden="true">
                    <span class="hct-blob hct-blob-a"></span>
                    <span class="hct-blob hct-blob-b"></span>
                    <span class="hct-blob hct-blob-c"></span>
                </span>
                <span class="hct-frost" aria-hidden="true"></span>
                <span class="hct-inner">
                    <span class="hct-top">
                        <span class="hct-series">Prism Series</span>
                        <span class="hct-no">No. 014</span>
                    </span>
                    <span class="hct-art" aria-hidden="true">
                        <svg viewBox="0 0 200 220" role="img" focusable="false">
                            <defs>
                                <linearGradient id="hctG1" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0" stop-color="#c8f7ff" />
                                    <stop offset="1" stop-color="#e8d9ff" />
                                </linearGradient>
                                <linearGradient id="hctG2" x1="1" y1="0" x2="0" y2="1">
                                    <stop offset="0" stop-color="#ffd9e8" />
                                    <stop offset="1" stop-color="#ffe9c8" />
                                </linearGradient>
                                <linearGradient id="hctG3" x1="0" y1="1" x2="1" y2="0">
                                    <stop offset="0" stop-color="#d9ffe3" />
                                    <stop offset="1" stop-color="#c8f7ff" />
                                </linearGradient>
                            </defs>
                            <path d="M2 62 L100 104" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.4" />
                            <path d="M100 104 L198 118" stroke="#ffd9e8" stroke-opacity=".65" stroke-width="1.4" />
                            <path d="M100 104 L198 140" stroke="#c8f7ff" stroke-opacity=".65" stroke-width="1.4" />
                            <path d="M100 104 L198 162" stroke="#d9ffe3" stroke-opacity=".6" stroke-width="1.4" />
                            <polygon points="100,18 62,74 100,104" fill="url(#hctG1)" fill-opacity=".9" />
                            <polygon points="100,18 138,74 100,104" fill="url(#hctG2)" fill-opacity=".85" />
                            <polygon points="62,74 74,186 100,104" fill="url(#hctG3)" fill-opacity=".8" />
                            <polygon points="138,74 126,186 100,104" fill="url(#hctG1)" fill-opacity=".55" />
                            <polygon points="74,186 126,186 100,104" fill="url(#hctG2)" fill-opacity=".6" />
                            <polygon points="100,18 138,74 126,186 74,186 62,74" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="1.2" />
                            <polygon points="34,132 44,146 26,148" fill="#e8d9ff" fill-opacity=".7" />
                            <polygon points="166,84 176,96 160,98" fill="#ffe9c8" fill-opacity=".7" />
                            <circle cx="48" cy="52" r="1.8" fill="#ffffff" fill-opacity=".9" />
                            <circle cx="158" cy="188" r="1.5" fill="#c8f7ff" fill-opacity=".9" />
                            <circle cx="146" cy="34" r="1.2" fill="#ffd9e8" fill-opacity=".9" />
                        </svg>
                    </span>
                    <span class="hct-meta">
                        <span class="hct-title">Aurora Shard</span>
                        <span class="hct-sub">Refraction relic. Ultra rare pull.</span>
                        <span class="hct-chip">
                            <svg viewBox="0 0 10 10" aria-hidden="true" focusable="false">
                                <polygon points="5,0 10,5 5,10 0,5" fill="currentColor" />
                            </svg>
                            Holo
                        </span>
                    </span>
                </span>
                <span class="hct-sparkle" aria-hidden="true"></span>
                <span class="hct-foil" aria-hidden="true"></span>
                <span class="hct-edge" aria-hidden="true"></span>
            </button>
        </div>
        <p class="hct-hint">Move to tilt <span aria-hidden="true">·</span> Press to flash</p>
    </main>
</body>
</html>
